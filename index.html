<!-- created frontend with help from copilot -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Movement Explainer</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172033;
            background: #edf2f7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 48px 20px;
        }

        main {
            width: min(860px, 100%);
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(28px, 5vw, 42px);
            letter-spacing: -0.04em;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #667085;
        }

        .panel {
            padding: 24px;
            border: 1px solid #d7dee8;
            border-radius: 14px;
            background: #ffffff;
            box-shadow: 0 12px 30px rgba(23, 32, 51, 0.08);
        }

        #analysis-form {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            align-items: end;
        }

        label {
            display: grid;
            gap: 7px;
            font-size: 13px;
            font-weight: 700;
            color: #344054;
        }

        input,
        textarea {
            width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            border: 1px solid #c8d0dc;
            border-radius: 8px;
            font: inherit;
            color: #172033;
            background: #ffffff;
        }

        textarea {
            min-height: 92px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: 3px solid rgba(46, 105, 255, 0.18);
            border-color: #2e69ff;
        }

        button {
            width: 100%;
            min-height: 46px;
            margin-top: 18px;
            border: 0;
            border-radius: 8px;
            font: inherit;
            font-weight: 750;
            color: #ffffff;
            background: #2257d8;
            cursor: pointer;
        }

        button:hover {
            background: #1948bd;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        .result-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 26px 0 10px;
        }

        .result-heading h2 {
            margin: 0;
            font-size: 17px;
        }

        #status {
            min-height: 20px;
            color: #667085;
            font-size: 13px;
        }

        #output {
            height: 360px;
            margin: 0;
            padding: 18px;
            overflow: auto;
            border: 1px solid #d7dee8;
            border-radius: 10px;
            color: #d9e2f1;
            background: #121826;
            font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .error {
            color: #ffb4ab !important;
        }

        .chat-section {
            margin-top: 30px;
            padding-top: 26px;
            border-top: 1px solid #d7dee8;
        }

        .chat-heading {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: baseline;
            margin-bottom: 12px;
        }

        .chat-heading h2 {
            margin: 0;
            font-size: 20px;
        }

        #chat-context,
        #chat-status {
            color: #667085;
            font-size: 13px;
        }

        #chat-form {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 170px;
            gap: 12px;
            align-items: end;
        }

        #chat-button {
            margin: 0;
        }

        #chat-output {
            height: 320px;
            margin: 14px 0 0;
            padding: 18px;
            overflow: auto;
            border: 1px solid #d7dee8;
            border-radius: 10px;
            color: #344054;
            background: #f8fafc;
            font: 15px/1.6 Inter, ui-sans-serif, system-ui, sans-serif;
            overflow-wrap: break-word;
            word-break: normal;
        }

        #chat-output.error {
            color: #b42318 !important;
        }

        #chat-output > :first-child {
            margin-top: 0;
        }

        #chat-output > :last-child {
            margin-bottom: 0;
        }

        #chat-output h1,
        #chat-output h2,
        #chat-output h3 {
            margin: 20px 0 8px;
            line-height: 1.3;
        }

        #chat-output h1 {
            font-size: 22px;
        }

        #chat-output h2 {
            font-size: 19px;
        }

        #chat-output h3 {
            font-size: 16px;
        }

        #chat-output p,
        #chat-output ul,
        #chat-output ol,
        #chat-output blockquote,
        #chat-output table {
            margin: 10px 0;
        }

        #chat-output table {
            width: 100%;
            min-width: 700px;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 14px;
        }

        #chat-output th,
        #chat-output td {
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            text-align: left;
            vertical-align: top;
            overflow-wrap: break-word;
            word-break: normal;
        }

        #chat-output th:nth-child(1),
        #chat-output td:nth-child(1) {
            width: 110px;
        }

        #chat-output th:nth-child(2),
        #chat-output td:nth-child(2) {
            width: 100px;
        }

        #chat-output th {
            background: #e8eef7;
        }

        #chat-output blockquote {
            padding-left: 14px;
            border-left: 4px solid #8aa4df;
            color: #526079;
        }

        #chat-output code {
            padding: 2px 5px;
            border-radius: 4px;
            background: #e8eef7;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        #chat-output pre {
            padding: 12px;
            overflow: auto;
            border-radius: 8px;
            background: #e8eef7;
        }

        #chat-output pre code {
            padding: 0;
        }

        @media (max-width: 720px) {
            body {
                padding: 28px 14px;
            }

            #analysis-form {
                grid-template-columns: 1fr 1fr;
            }

            #chat-form {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 460px) {
            #analysis-form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Stock Movement Analysis</h1>

        <section class="panel">
            <form id="analysis-form">
                <label>
                    Ticker
                    <input id="ticker" name="ticker" placeholder="e.g. NVDA" autocomplete="off" required>
                </label>

                <label>
                    Start date (MM/DD/YYYY)
                    <input id="start-date" name="start_date" type="text" placeholder="e.g. 05/01/2026" inputmode="numeric" required>
                </label>

                <label>
                    End date (MM/DD/YYYY)
                    <input id="end-date" name="end_date" type="text" placeholder="e.g. 07/01/2026" inputmode="numeric" required>
                </label>

                <label>
                    Threshold (%)
                    <input id="threshold" name="threshold" type="number" placeholder="e.g. 2" min="0.1" step="0.1" required>
                </label>

                <button id="submit-button" type="submit">Analyse stock</button>
            </form>

            <div class="result-heading">
                <h2>Results</h2>
                <span id="status"></span>
            </div>

            <pre id="output">Enter your filters and select “Analyse stock”.</pre>

            <section class="chat-section">
                <div class="chat-heading">
                    <h2>Chat about this analysis</h2>
                    <span id="chat-context">Run an analysis to begin</span>
                </div>

                <form id="chat-form">
                    <label>
                        Question
                        <textarea id="chat-question" placeholder="What was the largest movement, and which news might explain it?" required></textarea>
                    </label>

                    <button id="chat-button" type="submit" disabled>Ask Groq</button>
                </form>

                <div class="result-heading">
                    <h2>Response</h2>
                    <span id="chat-status"></span>
                </div>

                <div id="chat-output">Groq's answer will appear here.</div>
            </section>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked@18.0.12/lib/marked.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.15/dist/purify.min.js"></script>
    <script>
        const form = document.getElementById("analysis-form");
        const output = document.getElementById("output");
        const status = document.getElementById("status");
        const submitButton = document.getElementById("submit-button");
        const chatForm = document.getElementById("chat-form");
        const chatQuestion = document.getElementById("chat-question");
        const chatButton = document.getElementById("chat-button");
        const chatContext = document.getElementById("chat-context");
        const chatStatus = document.getElementById("chat-status");
        const chatOutput = document.getElementById("chat-output");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const ticker = document.getElementById("ticker").value.trim().toUpperCase();
            const startDate = document.getElementById("start-date").value;
            const endDate = document.getElementById("end-date").value;
            const threshold = document.getElementById("threshold").value;
            const query = new URLSearchParams({
                start_date: startDate,
                end_date: endDate,
                threshold: threshold,
            });

            submitButton.disabled = true;
            status.textContent = "Loading…";
            output.classList.remove("error");
            output.textContent = "Fetching historical prices…";

            try {
                const response = await fetch(
                    `/analysis/${encodeURIComponent(ticker)}?${query.toString()}`
                );
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "The request failed.");
                }

                output.textContent = JSON.stringify(data, null, 2);
                status.textContent = `${data.movement_count} major movement${data.movement_count === 1 ? "" : "s"}`;
                chatButton.disabled = false;
                chatContext.textContent = `${data.ticker} · ${data.start_date}–${data.end_date}`;
                chatOutput.classList.remove("error");
                chatOutput.textContent = "Ask a question about the analysis above.";
            } catch (error) {
                output.classList.add("error");
                output.textContent = `Error: ${error.message}`;
                status.textContent = "Unable to load results";
            } finally {
                submitButton.disabled = false;
            }
        });

        chatForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const question = chatQuestion.value.trim();

            if (!question) {
                return;
            }

            chatButton.disabled = true;
            chatStatus.textContent = "Thinking…";
            chatOutput.classList.remove("error");
            chatOutput.textContent = "Reviewing the saved stock and news data…";

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        question: question,
                    }),
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "The chat request failed.");
                }

                if (window.marked && window.DOMPurify) {
                    const renderedMarkdown = marked.parse(data.answer, {
                        gfm: true,
                        breaks: true,
                    });
                    chatOutput.innerHTML = DOMPurify.sanitize(renderedMarkdown);
                } else {
                    chatOutput.textContent = data.answer;
                }
                chatStatus.textContent = "Answered";
            } catch (error) {
                chatOutput.classList.add("error");
                chatOutput.textContent = `Error: ${error.message}`;
                chatStatus.textContent = "Unable to answer";
            } finally {
                chatButton.disabled = false;
            }
        });
    </script>
</body>
</html>
